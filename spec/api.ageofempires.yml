        lastUpdate:
          type: [string, 'null']
          format: date-time
        updateAvailable:
          type: [boolean, 'null']
        modFileSize:
          type: [number, 'null']
        modDiskSize:
          type: [number, 'null']
        popular:
          type: [integer, 'null']
        downloads:
          type: [integer, 'null']
        installs:
          type: [integer, 'null']
        likes:
          type: [integer, 'null']
        userLiked:
