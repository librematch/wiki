          type: integer
        installCount:
          type: integer
        gameTitleId:
          type: integer
        fileCRC:
          type: string

    UnsubscribeResponse:
      type: boolean

    RateModResponse:
      type: object
      description: |
        The envelope the captures answer: statusCode and responseMessage are
        always null and playFabResponse carries the refreshed aggregate.
      properties:
        statusCode:
          type: 'null'
          description: Always null.
        responseMessage:
          type: 'null'
          description: Always null.
        playFabResponse:
          $ref: '#/components/schemas/Ratings'
      required: [statusCode, responseMessage, playFabResponse]

    Ratings:
      description: |
        Rating aggregate of a mod. The captures of November 2026 carry only
        average and totalCount: the per-star counters and the two
        favourable-review blocks of the August captures are gone. The block is
        always an object, even when the mod has no ratings.
      type: object
      properties:
        rating:
          type: object
          properties:
            average:
              type: number
            totalCount:
              type: integer
        reviewsCount:
          type: integer

    FlagResponse:
      type: object
      properties:
        errorCode:
          type: integer
        errorMessage:
          type: string
        resultKey:
          type: string
        resultValue:
          type: string
        resultJson:
          type: [object, 'null']

    InstallModResponse:
      type: object
      properties:
        contentType:
          type: [string, 'null']
        serializerSettings:
          type: [object, 'null']
