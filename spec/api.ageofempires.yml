openapi: 3.2.1
info:
  title: Age of Empires API
  version: "2026-11-21"
  description: |
    OpenAPI description of the original Age of Empires service published at
    api.ageofempires.com: the v4 and legacy v1 mod catalogue, the legacy bug
    endpoints, polls, text moderation, the website metadata and the
    game-statistics and leaderboard endpoints used by the official website.

    This document describes the publisher's service, not the local
    reimplementation. It combines two evidence sources:

    * Traffic captured from the live service. These
      operations carry `x-source: capture` and reproduce the observed wire
      shape, quirks and examples.
    * The LibreMatch wiki (https://librematch.github.io/wiki/aoe/api/). Its
      endpoint pages cover operations that the captures do not include. They
      carry `x-source: wiki`; fields the wiki does not publish are left open
      (`WikiObject`).

    ## Fidelity

    * `Faithful` - captured from the original service; the shapes and quirks
      are the observed ones.
    * `Documented` - listed by the LibreMatch wiki but absent from the
      captures. The path and method are the documented ones; fields the wiki
      does not publish are not invented.

    ## Authentication

    * Game clients send `Authorization: Steam1.0 <ticket>`.
    * Microsoft Store clients send `Authorization: XBL3.0 x=<puid>;<XToken>`.
    * The website sends the `.AgeOfEmpiresServices` session cookie.

    The three schemes are alternatives. The publisher's backend does not
    publish its verification rules; this document only describes the headers
    the clients send and the viewer-dependent fields (`isLoggedOn`, `user*`
    and ownership) that the captured responses expose.

    ## Path matching

    The clients disagree on casing: AOE2 sends `/api/v4/mods/...`, AOE3 and
    AOE4 send `/api/v4/Mods/...`, and AOM mixes both in one session. The
    service accepts both. Each operation is documented once, with the casing
    of the captured or documented request.

    ## Requests

    * GET binds fields from the query string.
    * POST and PUT accept a JSON body (`Content-Type: application/json`) or an
      `application/x-www-form-urlencoded` one.
    * Publish, the legacy Create, PublishFile and CheckAndPublishFile use
      `multipart/form-data` or a raw binary body; the wiki documents the
      endpoint, not the exact multipart field list.
    * Unknown fields are ignored by the service.

    ## Responses

    * JSON is `application/json; charset=utf-8`.
    * Every captured list echoes the resolved filter in `searchParams`:
      `order` is upper-cased and `modid` is always a JSON string (`"0"` when
      unset).
    * A successful captured list carries `errorCode: -1` and an empty
      `errorMessage`.
    * `totalCount` is null on an empty page (and always null on the legacy v1
      `My`).
    * Errors use the `ErrorResponse` envelope. Its `errorCode` is not an HTTP
      status: 400 bad request, 900 unauthenticated, 404 not found, 429 rate
      limited, 500 internal error. Only the 401 also carries `isLoggedOn`.
    * The v4 `Detail` of a deleted mod answers the RFC 9110 `ProblemDetails`
      body instead.

    ## Pagination

    `start` is a 1-based page number: `OFFSET = max(0, start-1) * count`, and
    both 0 and 1 mean the first page. `count` 0 means "no limit". Sentinels:
    `q` `""` or `"*"`, `filter` 0 and `modid` 0/`""` mean "no filter"; a
    negative tag id excludes that tag.

    ## URLs

    `downloadUrl`, `fileUrl`, `imageName` and `imageThumbnail` are absolute
    URLs. A stored absolute URL (a CDN) is returned untouched.

    ## CORS

    The website preflights every POST. The service answers the preflight with
    204, allows `https://www.ageofempires.com`, never uses a wildcard while
    credentials are allowed, and advertises GET, POST, PUT and OPTIONS.

    ## Hosts

    The clients reach `api.ageofempires.com`; the downloads use
    `api-dr.ageofempires.com`. The wiki documents
    `api-dev.ageofempires.com` for `/Poll` only.

    ## Scope

    The local operational routes of the reimplementation (`/test`,
    `/cacert.pem` and `/openapi.yml`) and its reimplementation-only Media and
    MatchContent surfaces are deliberately absent: the captures and the wiki
    do not document them as original endpoints.
  contact:
    name: LibreMatch community documentation
    url: https://librematch.github.io/wiki/aoe/api/
externalDocs:
  description: LibreMatch wiki - Age of Empires API
  url: https://librematch.github.io/wiki/aoe/api/
servers:
  - url: https://api.ageofempires.com
    description: Production API host.
  - url: https://api-dev.ageofempires.com
    description: Development host; the wiki documents it for /Poll only.
  - url: https://api-dr.ageofempires.com
    description: Download/redirect host used by the clients' downloads.
security:
  - SteamAuth: []
  - XblAuth: []
  - WebSession: []
tags:
  - name: Games
    description: The titles the mods API serves.
  - name: Tags
    description: Mod types/tags of the catalogue.
  - name: Featured
    description: Featured mods.
  - name: Mods
    description: v4 search, detail, user state and mod management.
  - name: Legacy
    description: The legacy v1 mod surface, with its own row render.
  - name: Polls
    description: In-game polls.
  - name: Moderation
    description: Text moderation and the moderation endpoints documented by the wiki.
  - name: Bugs
    description: Legacy bug-reporting endpoints documented by the wiki.
  - name: GameStats
    description: Per-title statistics and match history documented by the wiki.
  - name: Leaderboards
    description: Ranked and event leaderboards documented by the wiki.
  - name: Web API
    description: Website metadata endpoints documented by the wiki.

components:
  securitySchemes:
    SteamAuth:
      type: http
      scheme: bearer
      bearerFormat: "Steam1.0"
      description: Steam authentication token sent by the game clients
    XblAuth:
      type: http
      scheme: bearer
      bearerFormat: "XBL3.0"
      description: |
        Xbox token of the Microsoft Store clients, sent as
        `XBL3.0 x=<puid>;<XToken>`. The AOE3 capture carries Steam for the
        read endpoints and this for `My`, `Publish` and `Delete` in the same
        session.
    WebSession:
      type: apiKey
      in: cookie
      name: .AgeOfEmpiresServices
      description: Website session cookie used by www.ageofempires.com instead of a Steam token
  parameters:
    GameQuery:
      name: game
      in: query
      required: false
      schema:
        type: integer
        enum: [1, 2, 3, 4, 1001]
      description: Game title id whose catalogue is returned; absent means every game.
    Comp:
      name: comp
      in: query
      required: false
      schema:
        type: string
        enum: [block, blocklist]
        default: block
      description: Upload stage. An absent or empty value behaves like `block`.
    BlockId:
      name: blockid
      in: query
      required: false
      schema:
        type: string
        default: "00000000"
      description: Azure block id of a `comp=block` request; empty means `00000000`.
    ModIdQuery:
      name: modId
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Mod the uploaded blocks belong to.
  headers:
    ContentDisposition:
      description: '`attachment; filename="<stored name>"`.'
      schema:
        type: string
  responses:
    BadRequest:
      description: The request could not be parsed, or a required or invalid field was rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              value:
                errorCode: 400
                errorMessage: invalid body
    Unauthorized:
      description: Missing or unknown credential, or the caller is not the creator of the mod.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                errorCode: 900
                errorMessage: Access Denied - User not authenticated.
                isLoggedOn: false
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                errorCode: 404
                errorMessage: not found
    ProblemNotFound:
      description: RFC 9110 problem document returned by the v4 Detail of a deleted mod.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            problem:
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Not Found
                status: 404
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
    InternalServerError:
      description: The service failed to read or write its store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              value:
                errorCode: 500
                errorMessage: internal error
  examples:
    GameList:
      summary: Two of the five supported titles
      value:
        - gameTitleId: 2
          gameTitleName: Age of Empires II DE
          gameVersion: null
        - gameTitleId: 1001
          gameTitleName: "Age of Mythology: Retold"
          gameVersion: null
    TagList:
      summary: Two mod types of one game
      value:
        - modTypeId: 15
          modTypeName: Random Maps
          gameTitleId: 2
        - modTypeId: 26
          modTypeName: Other
          gameTitleId: 2
    ModListPage:
      summary: One page of the resolved filter
      value:
        searchParams:
          q: ""
          creator: null
          filter: 0
          sort: popular
          order: DESC
          start: 1
          count: 30
          game: 2
          modid: "0"
        modList:
          - modId: 593779
